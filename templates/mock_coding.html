{% extends "base.html" %}
{% block title %}Mock Coding Round · HireNext{% endblock %}
{% block content %}

<div class="page-header">
  <div>
    <div class="page-title">Mock Coding Round</div>
    <div class="page-sub" id="coding-sub">Loading a coding question…</div>
  </div>
</div>

<!-- PROBLEM STATEMENT CARD -->
<div class="card">
  <div class="q-badge" id="coding-title">Coding Question</div>
  <div class="q-text" id="coding-problem">Loading…</div>
  <div class="sample-io" id="sample-io"></div>
</div>

<!-- CODE EDITOR CARD (a plain <textarea> — simplest possible code box) -->
<div class="card">
  <label class="section-label" for="code-box">YOUR CODE </label>
  <textarea id="code-box" class="code-box" spellcheck="false" aria-label=" code editor"></textarea>

  <!-- CUSTOM INPUT BOX — lets the student type their own stdin
       (e.g. just testing "print('hello world')" with no input() at all,
       or trying a different value than the AI's sample input) -->
  <label class="section-label" for="custom-input" style="margin-top:14px;display:block;">
    CUSTOM INPUT (STDIN) — edit or clear this before hitting Run
  </label>
  <textarea id="custom-input" class="code-box" style="min-height:60px;" spellcheck="false"
            aria-label="Custom input for Run Code"></textarea>

  <div class="nav-buttons">
    <button class="btn btn-outline" onclick="runCode()">Run Code</button>
    <button class="btn btn-primary" onclick="submitCode()">Submit Code</button>
  </div>
  <div class="run-output" id="run-output" style="display:none;" aria-live="polite"></div>
</div>

<!-- RESULT CARD (hidden until "Submit Code" is pressed) -->
<div class="card eval-grid" id="result-card" style="display:none;">
  <div class="score-card">
    <div style="font-size:12px;font-weight:700;color:var(--muted);">YOUR SCORE</div>
    <div class="ring">
      <svg width="150" height="150">
        <circle cx="75" cy="75" r="62" stroke="var(--indigo-light)" stroke-width="12" fill="none"/>
        <circle id="ring-fill" cx="75" cy="75" r="62" stroke="var(--indigo)" stroke-width="12" fill="none"
                stroke-dasharray="389" stroke-dashoffset="389" stroke-linecap="round"/>
      </svg>
      <div class="ring-label"><div class="ring-pct" id="ring-pct">0%</div><div class="ring-tag" id="ring-tag">Score</div></div>
    </div>
  </div>
  <div class="breakdown">
    <div style="font-size:12px;font-weight:700;color:var(--muted);margin-bottom:10px;">FEEDBACK</div>
    <div id="feedback-list"></div>
    <div style="font-size:12px;font-weight:700;color:var(--muted);margin:16px 0 10px;">TEST CASE RESULTS</div>
    <div id="test-results"></div>
  </div>
</div>

{% endblock %}

{% block scripts %}
<script>
// ---------------------------------------------------------------------
// Module 5 front-end logic.
// Talks to the Flask routes defined in modules/mock_coding.py:
//   POST /api/coding/start   -> get a new AI-generated question
//   POST /api/coding/run     -> quick-test your code (with a CUSTOM input)
//   POST /api/coding/submit  -> run against all test cases + get a score
// ---------------------------------------------------------------------

// Fetch a fresh coding question when the page loads
async function startCodingRound(){
  const res = await fetch('/api/coding/start', { method: 'POST' });
  const data = await res.json();

  if (data.error) {
    document.getElementById('coding-sub').textContent = 'Could not load a question — try refreshing.';
    document.getElementById('coding-problem').textContent = data.error;
    return;
  }

  document.getElementById('coding-title').textContent = data.title;
  document.getElementById('coding-problem').textContent = data.problem;
  document.getElementById('coding-sub').textContent = 'Solve the problem below and submit when ready';
  document.getElementById('sample-io').innerHTML =
    `<b>Example</b><br>Input: ${data.sample_input}<br>Output: ${data.sample_output}`;
  document.getElementById('code-box').value = data.starter_code;

  // Pre-fill the custom input box with the sample input, but the
  // student is free to change it or clear it completely (e.g. to
  // just test a plain "print('hello world')" with no input at all).
  document.getElementById('custom-input').value = data.sample_input;

  // Reset the result card for the new question
  document.getElementById('result-card').style.display = 'none';
  document.getElementById('run-output').style.display = 'none';
}

// "Run Code" -> quick check using whatever is in the Custom Input box
// (works fine even if that box is left completely empty and the
// student's code never calls input() at all — e.g. "print('hello world')")
async function runCode(){
  const code = document.getElementById('code-box').value;
  const customInput = document.getElementById('custom-input').value;

  const res = await fetch('/api/coding/run', {
    method: 'POST',
    headers: {'Content-Type':'application/json'},
    body: JSON.stringify({ code, custom_input: customInput })
  });
  const data = await res.json();

  const box = document.getElementById('run-output');
  box.style.display = 'block';
  box.innerHTML = data.error
    ? `<b style="color:var(--red)">Error:</b> ${data.error}`
    : `<b>Output:</b> ${data.output}`;
}

// "Submit Code" -> run against every official test case and show the score
// (always uses the AI's real test cases, NOT the custom input box)
async function submitCode(){
  const code = document.getElementById('code-box').value;
  const res = await fetch('/api/coding/submit', {
    method: 'POST',
    headers: {'Content-Type':'application/json'},
    body: JSON.stringify({ code })
  });
  const data = await res.json();

  if (data.error) {
    document.getElementById('run-output').style.display = 'block';
    document.getElementById('run-output').innerHTML = `<b style="color:var(--red)">Error:</b> ${data.error}`;
    return;
  }

  // Fill in the score ring
  document.getElementById('ring-pct').textContent = data.score + '%';
  const offset = 389 - (389 * data.score / 100);
  document.getElementById('ring-fill').setAttribute('stroke-dashoffset', offset);
  document.getElementById('ring-tag').textContent =
    data.score >= 80 ? 'Excellent' : data.score >= 50 ? 'Good' : 'Keep practicing';

  // Fill in feedback text
  document.getElementById('feedback-list').innerHTML =
  data.feedback.map(f => `<div class="feedback-item">${f}</div>`).join('');

  // Fill in per-test-case pass/fail results
  document.getElementById('test-results').innerHTML = data.results.map((r, i) => `
    <div class="feedback-item">
      <b>Test ${i+1}:</b> ${r.passed ? '✅ Passed' : '❌ Failed'}<br>
      Input: ${r.input} &nbsp; | &nbsp; Expected: ${r.expected} &nbsp; | &nbsp; Got: ${r.got}
    </div>`).join('');

  document.getElementById('result-card').style.display = 'flex';
}

startCodingRound();
</script>
{% endblock %}
